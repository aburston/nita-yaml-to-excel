[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-to-excel"
version = "22.8.0"
description = "Bidirectional conversion of YAML files to Microsoft Excel."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Juniper Networks", email = "aburston@juniper.net" },
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/Juniper/nita-yaml-to-excel"
Source   = "https://github.com/Juniper/nita-yaml-to-excel"

[project.scripts]
yaml2xls = "yamltoexcel.yaml2xls:main"
xls2yaml = "yamltoexcel.xls2yaml:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.2",
    "ddt>=1.7",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["yamltoexcel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"

[tool.coverage.run]
source = ["yamltoexcel"]
omit   = ["*/tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
fail_under   = 80
